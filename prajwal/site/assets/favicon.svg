<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prajwal logo">
  <title>Prajwal — fsociety-style mask</title>
  <defs>
    <clipPath id="sTop"><rect x="0" y="0" width="64" height="36"/></clipPath>
    <clipPath id="sMid"><rect x="0" y="36" width="64" height="4"/></clipPath>
    <clipPath id="sBot"><rect x="0" y="40" width="64" height="24"/></clipPath>
    <path id="sil" d="M32 7 C41 7 48 11 49.5 22 C51 33 44 45 32 56 C20 45 13 33 14.5 22 C16 11 23 7 32 7 Z"/>
    <g id="face">
      <use href="#sil" fill="#f3ede1"/>
      <!-- eye holes -->
      <ellipse cx="24" cy="27.5" rx="5.2" ry="3.4" fill="#17120d" transform="rotate(-14 24 27.5)"/>
      <ellipse cx="40" cy="27.5" rx="5.2" ry="3.4" fill="#17120d" transform="rotate(14 40 27.5)"/>
      <!-- arched brows -->
      <path fill="none" stroke="#17120d" stroke-width="1.7" stroke-linecap="round" d="M18.5 21.5 Q24 17.8 29.5 21"/>
      <path fill="none" stroke="#17120d" stroke-width="1.7" stroke-linecap="round" d="M34.5 21 Q40 17.8 45.5 21.5"/>
      <!-- blush cheeks -->
      <circle cx="21.5" cy="34.5" r="3.6" fill="#e27a7a" opacity="0.5"/>
      <circle cx="42.5" cy="34.5" r="3.6" fill="#e27a7a" opacity="0.5"/>
      <!-- handlebar mustache -->
      <path fill="none" stroke="#17120d" stroke-width="1.7" stroke-linecap="round" d="M32 38.6 C28.8 36.4 25 35.8 21.8 37.2"/>
      <path fill="none" stroke="#17120d" stroke-width="1.7" stroke-linecap="round" d="M32 38.6 C35.2 36.4 39 35.8 42.2 37.2"/>
      <!-- grin -->
      <path fill="none" stroke="#17120d" stroke-width="1.3" stroke-linecap="round" d="M27 42.6 Q32 45.2 37 42.6"/>
      <!-- pointed goatee -->
      <path fill="#17120d" d="M30.7 46 H33.3 L32 52.5 Z"/>
    </g>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="13" fill="#0a0f16"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="12.25" fill="none" stroke="#273447" stroke-width="1.5"/>

  <!-- chromatic ghosts (silhouette fringe) -->
  <use href="#sil" opacity="0.6" transform="translate(-2 0.6)" fill="#4de0ff"/>
  <use href="#sil" opacity="0.55" transform="translate(2 -0.6)" fill="#ff5263"/>

  <!-- sliced main mask (glitch cut through the grin) -->
  <use href="#face" clip-path="url(#sTop)"/>
  <use href="#face" clip-path="url(#sMid)" transform="translate(2.5 0)"/>
  <use href="#face" clip-path="url(#sBot)" transform="translate(-1.2 0)"/>

  <!-- glitch scan line -->
  <rect x="12" y="37.6" width="40" height="1.1" fill="#ffd9a0" opacity="0.85"/>
</svg>
